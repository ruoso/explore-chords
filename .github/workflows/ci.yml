name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed by the deploy job. Read-only elsewhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and unit tests are milliseconds, so a broken core fails here rather
  # than after a multi-minute browser run. See docs/DESIGN.md §9.7.
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The base path fixes both asset URLs and the service worker scope
      # (§3.1), and getting it wrong fails silently in the browser. Assert it
      # rather than trusting the config.
      - name: Verify base path
        run: |
          grep -q '/explore-chords/assets/' dist/index.html \
            || { echo "Built index.html does not reference /explore-chords/assets/"; exit 1; }

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
